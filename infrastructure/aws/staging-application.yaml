AWSTemplateFormatVersion: '2010-09-09'
Description: MCClinic synthetic staging application - LOCAL PREPARATION ONLY, no apply authorization
Parameters:
  MailboxImage:
    Type: String
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/.+@sha256:[a-f0-9]{64}'
  RegistryArn: { Type: String }
  VpcId: { Type: AWS::EC2::VPC::Id }
  PrivateSubnetA: { Type: AWS::EC2::Subnet::Id }
  PrivateSubnetB: { Type: AWS::EC2::Subnet::Id }
  RuntimeSecurityGroup: { Type: AWS::EC2::SecurityGroup::Id }
  RuntimeRoleName: { Type: String }
  RuntimeRoleArn: { Type: String }
  ExecutionRoleName: { Type: String }
  ExecutionRoleArn: { Type: String }
  ClusterName: { Type: String }
  ApiLogGroup: { Type: String }
  StorageKeyArn: { Type: String }
  AlertTopic: { Type: String }
  DatabaseHost: { Type: String }
  DatabaseCaPem: { Type: String, MinLength: 100 }
  RuntimeSecretArn:
    {
      Type: String,
      AllowedPattern: 'arn:aws:secretsmanager:ap-southeast-1:[0-9]{12}:secret:.+',
    }
  IdentityEnvelopeSecretArn:
    {
      Type: String,
      AllowedPattern: 'arn:aws:secretsmanager:ap-southeast-1:[0-9]{12}:secret:.+',
    }
  OriginSecretArn:
    {
      Type: String,
      AllowedPattern: 'arn:aws:secretsmanager:ap-southeast-1:[0-9]{12}:secret:.+',
    }
  IntegrationSecretKeyArn:
    {
      Type: String,
      AllowedPattern: 'arn:aws:kms:ap-southeast-1:[0-9]{12}:key/.+',
    }
  ApiImage:
    {
      Type: String,
      AllowedPattern: '[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/.+@sha256:[a-f0-9]{64}',
    }
  WebAssetsBucket: { Type: String }
  WebDomain: { Type: String, AllowedPattern: '[a-z0-9.-]+' }
  OriginDomain: { Type: String, AllowedPattern: '[a-z0-9.-]+' }
  HostedZoneId: { Type: AWS::Route53::HostedZone::Id }
  EdgeCertificateArn:
    {
      Type: String,
      AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+',
    }
  OriginCertificateArn:
    {
      Type: String,
      AllowedPattern: 'arn:aws:acm:ap-southeast-1:[0-9]{12}:certificate/.+',
    }
  EdgeWebAclArn:
    {
      Type: String,
      AllowedPattern: 'arn:aws:wafv2:us-east-1:[0-9]{12}:global/webacl/.+',
    }
  CloudFrontPrefixListId: { Type: String, AllowedPattern: 'pl-[0-9a-f]+' }
  SyntheticDomains:
    {
      Type: String,
      Default: example.test,
      AllowedPattern: '([a-z0-9-]+\.)+test(,([a-z0-9-]+\.)+test)*',
    }
  DesiredCount: { Type: Number, Default: 0, AllowedValues: [0, 1] }
  EnableNetworkCustody:
    { Type: String, Default: 'false', AllowedValues: ['false', 'true'] }
Rules:
  SingaporeOnly:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, ap-southeast-1]
        AssertDescription: Application resources are Singapore only
  ActivationRequiresCustody:
    RuleCondition: !Equals [!Ref DesiredCount, '1']
    Assertions:
      - Assert: !Equals [!Ref EnableNetworkCustody, 'true']
        AssertDescription: Network custody must be explicitly enabled before starting a task
Conditions:
  ServiceActive: !Equals [!Ref DesiredCount, 1]
Resources:
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref VpcId, InternetGatewayId: !Ref Gateway }
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      {
        VpcId: !Ref VpcId,
        CidrBlock: 10.80.20.0/24,
        AvailabilityZone: !Select [0, !GetAZs ''],
        MapPublicIpOnLaunch: false,
      }
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      {
        VpcId: !Ref VpcId,
        CidrBlock: 10.80.21.0/24,
        AvailabilityZone: !Select [1, !GetAZs ''],
        MapPublicIpOnLaunch: false,
      }
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VpcId }
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      {
        RouteTableId: !Ref PublicRoutes,
        DestinationCidrBlock: 0.0.0.0/0,
        GatewayId: !Ref Gateway,
      }
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRoutes, SubnetId: !Ref PublicA }
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRoutes, SubnetId: !Ref PublicB }
  LoadBalancerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: CloudFront origin TLS ingress only
      SecurityGroupIngress:
        [
          {
            IpProtocol: tcp,
            FromPort: 443,
            ToPort: 443,
            SourcePrefixListId: !Ref CloudFrontPrefixListId,
          },
        ]
      SecurityGroupEgress:
        [
          {
            IpProtocol: tcp,
            FromPort: 4000,
            ToPort: 4000,
            DestinationSecurityGroupId: !Ref RuntimeSecurityGroup,
          },
        ]
  RuntimeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      {
        GroupId: !Ref RuntimeSecurityGroup,
        IpProtocol: tcp,
        FromPort: 4000,
        ToPort: 4000,
        SourceSecurityGroupId: !Ref LoadBalancerGroup,
      }
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: InternetRoute
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref LoadBalancerGroup]
      LoadBalancerAttributes:
        - { Key: deletion_protection.enabled, Value: 'true' }
        - {
            Key: routing.http.drop_invalid_header_fields.enabled,
            Value: 'true',
          }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
  Target:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 4000
      HealthCheckPath: /health/ready
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        [{ Key: deregistration_delay.timeout_seconds, Value: '30' }]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates: [{ CertificateArn: !Ref OriginCertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        [
          {
            Type: fixed-response,
            FixedResponseConfig:
              {
                StatusCode: '403',
                ContentType: text/plain,
                MessageBody: Staging origin access denied,
              },
          },
        ]
  OriginRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: x-mcclinic-origin
            Values:
              [
                !Sub '{{resolve:secretsmanager:${OriginSecretArn}:SecretString}}',
              ]
      Actions: [{ Type: forward, TargetGroupArn: !Ref Target }]
  OriginDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginDomain
      Type: A
      AliasTarget:
        {
          DNSName: !GetAtt LoadBalancer.DNSName,
          HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID,
        }
  SinkGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Private synthetic mailbox NFS
      SecurityGroupIngress:
        [
          {
            IpProtocol: tcp,
            FromPort: 2049,
            ToPort: 2049,
            SourceSecurityGroupId: !Ref RuntimeSecurityGroup,
          },
        ]
      SecurityGroupEgress:
        [
          {
            IpProtocol: tcp,
            FromPort: 65535,
            ToPort: 65535,
            CidrIp: 127.0.0.1/32,
          },
        ]
  RuntimeSinkEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      {
        GroupId: !Ref RuntimeSecurityGroup,
        IpProtocol: tcp,
        FromPort: 2049,
        ToPort: 2049,
        DestinationSecurityGroupId: !Ref SinkGroup,
      }
  Sink:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      KmsKeyId: !Ref StorageKeyArn
      BackupPolicy: { Status: ENABLED }
      FileSystemPolicy:
        Version: '2012-10-17'
        Statement:
          - {
              Effect: Deny,
              Principal: '*',
              Action: 'elasticfilesystem:*',
              Resource: '*',
              Condition: { Bool: { aws:SecureTransport: 'false' } },
            }
          - Effect: Deny
            Principal: '*'
            Action:
              [
                'elasticfilesystem:ClientMount',
                'elasticfilesystem:ClientWrite',
                'elasticfilesystem:ClientRootAccess',
              ]
            Resource: '*'
            Condition:
              {
                StringNotEquals:
                  {
                    aws:PrincipalArn:
                      [!Ref RuntimeRoleArn, !GetAtt MailboxReaderRole.Arn],
                  },
              }
  SinkAccess:
    Type: AWS::EFS::AccessPoint
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FileSystemId: !Ref Sink
      PosixUser: { Uid: '1000', Gid: '1000' }
      RootDirectory:
        {
          Path: /synthetic-identity,
          CreationInfo:
            { OwnerUid: '1000', OwnerGid: '1000', Permissions: '0700' },
        }
  SinkMountA:
    Type: AWS::EFS::MountTarget
    Properties:
      {
        FileSystemId: !Ref Sink,
        SubnetId: !Ref PrivateSubnetA,
        SecurityGroups: [!Ref SinkGroup],
      }
  SinkMountB:
    Type: AWS::EFS::MountTarget
    Properties:
      {
        FileSystemId: !Ref Sink,
        SubnetId: !Ref PrivateSubnetB,
        SecurityGroups: [!Ref SinkGroup],
      }
  RuntimeSinkPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: mcclinic-synthetic-mailbox
      Roles: [!Ref RuntimeRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              ['elasticfilesystem:ClientMount', 'elasticfilesystem:ClientWrite']
            Resource: !GetAtt Sink.Arn
            Condition:
              {
                StringEquals:
                  { elasticfilesystem:AccessPointArn: !GetAtt SinkAccess.Arn },
                Bool: { aws:SecureTransport: 'true' },
              }
  IntegrationSecretsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: mcclinic-synthetic-integration-secrets
      Roles: [!Ref ExecutionRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: [!Ref IdentityEnvelopeSecretArn, !Ref OriginSecretArn]
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !Ref IntegrationSecretKeyArn
            Condition:
              StringEquals:
                kms:ViaService: secretsmanager.ap-southeast-1.amazonaws.com
                kms:EncryptionContext:SecretARN:
                  [!Ref IdentityEnvelopeSecretArn, !Ref OriginSecretArn]
  ApiTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      TaskRoleArn: !Ref RuntimeRoleArn
      ExecutionRoleArn: !Ref ExecutionRoleArn
      Volumes:
        - Name: synthetic-state
          EFSVolumeConfiguration:
            FilesystemId: !Ref Sink
            TransitEncryption: ENABLED
            AuthorizationConfig:
              { AccessPointId: !Ref SinkAccess, IAM: ENABLED }
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          User: '1000:1000'
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          StopTimeout: 30
          PortMappings: [{ ContainerPort: 4000, Protocol: tcp }]
          MountPoints:
            [
              {
                SourceVolume: synthetic-state,
                ContainerPath: /var/lib/mcclinic,
                ReadOnly: false,
              },
            ]
          Environment:
            - { Name: APP_ENV, Value: synthetic-staging }
            - { Name: MVP_SYNTHETIC_ONLY, Value: 'true' }
            - { Name: WEB_ORIGIN, Value: !Sub 'https://${WebDomain}' }
            - { Name: DB_HOST, Value: !Ref DatabaseHost }
            - { Name: DB_CA_PEM, Value: !Ref DatabaseCaPem }
            - { Name: EHR_LOCAL_STATE_DIR, Value: /var/lib/mcclinic }
            - { Name: IDENTITY_SYNTHETIC_DOMAINS, Value: !Ref SyntheticDomains }
            - {
                Name: IDENTITY_KMS_ALLOW_NETWORK,
                Value: !Ref EnableNetworkCustody,
              }
          Secrets:
            - { Name: DB_RUNTIME_SECRET, ValueFrom: !Ref RuntimeSecretArn }
            - {
                Name: IDENTITY_KMS_ENVELOPE,
                ValueFrom: !Ref IdentityEnvelopeSecretArn,
              }
            - { Name: STAGING_ORIGIN_SECRET, ValueFrom: !Ref OriginSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              {
                awslogs-group: !Ref ApiLogGroup,
                awslogs-region: !Ref AWS::Region,
                awslogs-stream-prefix: staging-api,
              }
  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      [
        OriginRule,
        SinkMountA,
        SinkMountB,
        RuntimeSinkPolicy,
        IntegrationSecretsPolicy,
      ]
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref ApiTask
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      EnableExecuteCommand: false
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        {
          MinimumHealthyPercent: 100,
          MaximumPercent: 200,
          DeploymentCircuitBreaker: { Enable: true, Rollback: true },
        }
      NetworkConfiguration:
        AwsvpcConfiguration:
          {
            AssignPublicIp: DISABLED,
            Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB],
            SecurityGroups: [!Ref RuntimeSecurityGroup],
          }
      LoadBalancers:
        [
          {
            ContainerName: api,
            ContainerPort: 4000,
            TargetGroupArn: !Ref Target,
          },
        ]
  NoCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-no-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
  ApiForwarding:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-api-forwarding'
        CookiesConfig: { CookieBehavior: all }
        HeadersConfig: { HeaderBehavior: allExcept, Headers: [host] }
        QueryStringsConfig: { QueryStringBehavior: all }
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        CustomHeadersConfig:
          Items: [{ Header: Cache-Control, Value: no-store, Override: true }]
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          ReferrerPolicy: { ReferrerPolicy: no-referrer, Override: true }
          FrameOptions: { FrameOption: SAMEORIGIN, Override: true }
          StrictTransportSecurity:
            {
              AccessControlMaxAgeSec: 31536000,
              IncludeSubdomains: false,
              Preload: false,
              Override: true,
            }
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'"
            Override: true
  ShellRouting:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-shell'
      AutoPublish: true
      FunctionConfig:
        {
          Comment: Exact public app-shell routes only,
          Runtime: cloudfront-js-2.0,
        }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/' || request.uri === '/clinic' || request.uri === '/clinic/') request.uri = '/index.html';
          return request;
        }
  AssetsAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        {
          Name: !Sub '${AWS::StackName}-assets',
          OriginAccessControlOriginType: s3,
          SigningBehavior: always,
          SigningProtocol: sigv4,
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: [!Ref WebDomain]
        WebACLId: !Ref EdgeWebAclArn
        HttpVersion: http2and3
        IPV6Enabled: false
        ViewerCertificate:
          {
            AcmCertificateArn: !Ref EdgeCertificateArn,
            SslSupportMethod: sni-only,
            MinimumProtocolVersion: TLSv1.2_2021,
          }
        Origins:
          - Id: assets
            DomainName: !Sub '${WebAssetsBucket}.s3.ap-southeast-1.amazonaws.com'
            OriginAccessControlId: !GetAtt AssetsAccess.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            DomainName: !Ref OriginDomain
            CustomOriginConfig:
              {
                OriginProtocolPolicy: https-only,
                HTTPSPort: 443,
                OriginSSLProtocols: [TLSv1.2],
                OriginReadTimeout: 30,
              }
            OriginCustomHeaders:
              [
                {
                  HeaderName: x-mcclinic-origin,
                  HeaderValue: !Sub '{{resolve:secretsmanager:${OriginSecretArn}:SecretString}}',
                },
              ]
        DefaultCacheBehavior:
          TargetOriginId: assets
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachePolicyId: !Ref NoCache
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            [
              {
                EventType: viewer-request,
                FunctionARN: !GetAtt ShellRouting.FunctionARN,
              },
            ]
        CacheBehaviors:
          - PathPattern: /mvp/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ApiForwarding
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /graphql
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref ApiForwarding
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        CustomErrorResponses:
          - { ErrorCode: 403, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 500, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 502, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 503, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 504, ErrorCachingMinTTL: 0 }
  WebDns:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WebDomain
      Type: A
      AliasTarget:
        {
          DNSName: !GetAtt Distribution.DomainName,
          HostedZoneId: Z2FDTNDATAQYW2,
        }
  UnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: !If [ServiceActive, true, false]
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        [
          {
            Name: LoadBalancer,
            Value: !GetAtt LoadBalancer.LoadBalancerFullName,
          },
          { Name: TargetGroup, Value: !GetAtt Target.TargetGroupFullName },
        ]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: !If [ServiceActive, true, false]
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        [
          {
            Name: LoadBalancer,
            Value: !GetAtt LoadBalancer.LoadBalancerFullName,
          },
        ]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  RuntimeFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      FilterPattern: '?unavailable ?failed'
      MetricTransformations:
        - MetricNamespace: MCClinic/SyntheticStaging
          MetricName: !Sub '${AWS::StackName}-runtime-failure'
          MetricValue: '1'
          DefaultValue: 0
  RuntimeFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: !If [ServiceActive, true, false]
      Namespace: MCClinic/SyntheticStaging
      MetricName: !Sub '${AWS::StackName}-runtime-failure'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  MailboxReaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike:
                {
                  aws:SourceArn: !Sub 'arn:aws:ecs:ap-southeast-1:${AWS::AccountId}:*',
                }
  MailboxReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: synthetic-mailbox-read-only
      Roles: [!Ref MailboxReaderRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: elasticfilesystem:ClientMount
            Resource: !GetAtt Sink.Arn
            Condition:
              StringEquals:
                { elasticfilesystem:AccessPointArn: !GetAtt SinkAccess.Arn }
              Bool: { aws:SecureTransport: 'true' }
  MailboxExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike:
                {
                  aws:SourceArn: !Sub 'arn:aws:ecs:ap-southeast-1:${AWS::AccountId}:*',
                }
      Policies:
        - PolicyName: image-and-sealed-output-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {
                  Effect: Allow,
                  Action: 'ecr:GetAuthorizationToken',
                  Resource: '*',
                }
              - {
                  Effect: Allow,
                  Action:
                    [
                      'ecr:BatchCheckLayerAvailability',
                      'ecr:GetDownloadUrlForLayer',
                      'ecr:BatchGetImage',
                    ],
                  Resource: !Ref RegistryArn,
                }
              - {
                  Effect: Allow,
                  Action: ['logs:CreateLogStream', 'logs:PutLogEvents'],
                  Resource: !Sub 'arn:aws:logs:ap-southeast-1:${AWS::AccountId}:log-group:${ApiLogGroup}:*',
                }
  MailboxReadJob:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      TaskRoleArn: !GetAtt MailboxReaderRole.Arn
      ExecutionRoleArn: !GetAtt MailboxExecutionRole.Arn
      Volumes:
        - Name: synthetic-state
          EFSVolumeConfiguration:
            FilesystemId: !Ref Sink
            TransitEncryption: ENABLED
            AuthorizationConfig:
              { AccessPointId: !Ref SinkAccess, IAM: ENABLED }
      ContainerDefinitions:
        - Name: mailbox-read
          Image: !Ref MailboxImage
          User: '1000:1000'
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          MountPoints:
            [
              {
                SourceVolume: synthetic-state,
                ContainerPath: /var/lib/mcclinic,
                ReadOnly: true,
              },
            ]
          Environment:
            - { Name: APP_ENV, Value: synthetic-staging }
            - { Name: MVP_SYNTHETIC_ONLY, Value: 'true' }
            - { Name: STAGING_OPERATOR_JOB, Value: explicit-synthetic-job }
            - { Name: EHR_LOCAL_STATE_DIR, Value: /var/lib/mcclinic }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              {
                awslogs-group: !Ref ApiLogGroup,
                awslogs-region: !Ref AWS::Region,
                awslogs-stream-prefix: sealed-mailbox,
              }
Outputs:
  MailboxReadTaskDefinition: { Value: !Ref MailboxReadJob }
  DistributionArn:
    {
      Value: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}',
    }
  ApiTaskDefinition: { Value: !Ref ApiTask }
  ServiceName: { Value: !GetAtt ApiService.Name }
  SinkAccessPoint: { Value: !Ref SinkAccess }
