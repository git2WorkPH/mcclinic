services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mcclinic
      POSTGRES_USER: ehr_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ehr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr_dev -d mcclinic"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  ehr_postgres:
